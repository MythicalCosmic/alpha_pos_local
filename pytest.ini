[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
# Always test the core commit pinned by this repository. Without this, a stale
# globally/editably installed ``base`` package can silently shadow the submodule.
pythonpath =
    .
    alpha_pos_core
testpaths =
    customers/tests
    waiters/tests
    couriers/tests
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Importlib mode keeps nested test packages isolated from application imports.
# The shared core has its own test suite and is validated from its checkout.
addopts = -ra --strict-markers --strict-config --import-mode=importlib
markers =
    slow: tests that exercise multiple subsystems
