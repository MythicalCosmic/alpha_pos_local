name: Desktop (Windows)

# Native Windows build + smoke of the desktop app (pywebview launcher,
# embedded PostgreSQL, uvicorn). The release installer is built under Wine;
# this job proves the same sources build and run on real Windows with a real
# WebView2 runtime, and measures local API latency there.
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/desktop-*'
    paths:
      - 'desktop/**'
      - 'config/**'
      - 'customers/**'
      - 'alpha_pos_core'
      - 'AlphaPOS.spec'
      - 'requirements-desktop.txt'
      - 'tools/**'
      - '.github/workflows/desktop-windows.yml'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PG_ZIP_URL: https://get.enterprisedb.com/postgresql/postgresql-16.6-1-windows-x64-binaries.zip
      # Keep the smoke run offline and self-contained.
      SECRET_KEY: ci-desktop-smoke-only
      SYNC_ENABLED: 'False'
      LICENSE_HEARTBEAT_DISABLED: '1'
      LICENSE_CONTROL_CENTER_URL: http://127.0.0.1:9/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Portable PostgreSQL 16.6
        id: pg
        uses: actions/cache@v4
        with:
          path: _pg
          key: pgsql-16.6-1-windows-x64

      - name: Download PostgreSQL binaries
        if: steps.pg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PG_ZIP_URL -OutFile pg.zip
          Expand-Archive pg.zip -DestinationPath _pg
          Remove-Item pg.zip

      - name: Build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller
          python -m pip install --no-deps --no-build-isolation ./alpha_pos_core

      - name: Build the desktop app
        shell: pwsh
        env:
          ALPHA_POS_PGSQL_DIR: ${{ github.workspace }}\_pg\pgsql
        run: |
          python desktop/make_icon.py
          python -m PyInstaller --noconfirm --clean AlphaPOS.spec

      - name: Selftest
        shell: pwsh
        run: |
          $p = Start-Process dist\AlphaPOS\AlphaPOS.exe -ArgumentList '--selftest', '--no-update' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Real window - screenshot the panel, measure latency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-window-e2e | Out-Null
          $app = Start-Process dist\AlphaPOS\AlphaPOS.exe -ArgumentList '--no-update' -PassThru
          try {
            $client = [System.Net.Http.HttpClient]::new()
            $deadline = (Get-Date).AddMinutes(4)
            while ($true) {
              try { if ($client.GetStringAsync('http://127.0.0.1:8000/healthz').Result -like 'ok*') { break } } catch { }
              if ((Get-Date) -gt $deadline) { throw 'POS server never answered' }
              Start-Sleep -Seconds 2
            }
            # pywebview sets its own WebView2 arguments, so no debugger can attach:
            # capture the real screen instead and keep it as evidence.
            Start-Sleep -Seconds 15
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD\ci-window-e2e\screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
            Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String | Tee-Object ci-window-e2e\windows.txt
            if (-not (Get-Process AlphaPOS | Where-Object { $_.MainWindowTitle -eq 'Alpha POS' })) { throw 'the Alpha POS window is not open' }
            # Warm, then time 200 sequential requests through the POS server.
            1..20 | ForEach-Object { $null = $client.GetStringAsync('http://127.0.0.1:8000/healthz').Result }
            $times = 1..200 | ForEach-Object {
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              $null = $client.GetStringAsync('http://127.0.0.1:8000/healthz').Result
              $sw.Elapsed.TotalMilliseconds
            }
            $sorted = $times | Sort-Object
            $avg = ($times | Measure-Object -Average).Average
            $p95 = $sorted[[int]($sorted.Count * 0.95) - 1]
            "healthz: avg {0:N2} ms, p50 {1:N2} ms, p95 {2:N2} ms" -f $avg, $sorted[100], $p95 | Tee-Object ci-window-e2e\latency.txt
            if ($avg -gt 10) { throw "local API too slow: avg $avg ms" }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          if (Test-Path "$env:LOCALAPPDATA\AlphaPOS\logs") { Copy-Item "$env:LOCALAPPDATA\AlphaPOS\logs\*" ci-logs -Recurse -ErrorAction SilentlyContinue }
          if (Test-Path "$env:LOCALAPPDATA\AlphaPOS\pgdata\pg.log") { Copy-Item "$env:LOCALAPPDATA\AlphaPOS\pgdata\pg.log" ci-logs }
          if (Test-Path ci-window-e2e) { Copy-Item ci-window-e2e ci-logs -Recurse -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows-${{ github.sha }}
          path: ci-logs
          retention-days: 7
