<!DOCTYPE html>
<html lang="en" data-dir="porcelain">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha POS Backend</title>
<link rel="icon" type="image/png" href="AlphaPOS.png">
<!-- Fully local first paint: a render-blocking Google Fonts request made the
     window appear blank/slow whenever a till's internet or DNS was degraded.
     themes.css uses polished native system-font stacks instead. -->
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="root"></div>

<!-- Per-launch control token injected by control_server.py; the bridge sends it
     on every /api call so a stray browser page can't drive the panel. -->
<script>window.__CONTROL_TOKEN__ = "{{CONTROL_TOKEN}}";</script>

<!-- React is vendored for offline tills. JSX is compiled once at release time,
     not by a 3.1 MB Babel runtime on every operator launch. Regenerate with:
       node tools/compile_desktop_ui.js -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/smart-jowi/chart.js"></script>
<script src="app.bundle.js"></script>
</body>
</html>
