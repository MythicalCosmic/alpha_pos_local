[package]
name = "alphapos-update"
description = "Alpha POS update installer guard and shared update state"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "alphapos_update"
path = "src/lib.rs"

[[bin]]
name = "alphapos-update-guard"
path = "src/main.rs"

[dependencies]
alphapos-shell-core = { path = "../shell-core" }
base64 = "0.22"
minisign-verify = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
